name: Agrícola tests

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pandas
      - name: Release gate (manifest, smoke, tests, tenants)
        env:
          PYTHONPATH: ${{ github.workspace }}
          APP_ROOT: ${{ github.workspace }}
        run: python3 scripts/verify_agricola_release.py
