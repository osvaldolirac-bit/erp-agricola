<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Constructora · Acceso · ERP Master</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon-32x32.png') }}?v=1785543581" sizes="32x32">
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}?v=1785543581">
  <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}?v=1785543581" sizes="any">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}?v=1785543581">
  <link rel="shortcut icon" href="{{ url_for('favicon') }}?v=1785543581">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/app.css') }}" rel="stylesheet">
</head>
<body class="login-page">
  <div class="login-stage">
    <header class="login-top">
      <div class="dropdown login-access">
        <button class="btn login-access-btn dropdown-toggle" type="button" data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false">
          Acceso
        </button>
        <div class="dropdown-menu dropdown-menu-end login-access-menu p-3">
          {% if error %}<div class="alert alert-danger py-2 mb-2">{{ error }}</div>{% endif %}
          <form method="post" id="loginForm">
            <div class="mb-2">
              <label class="form-label fw-bold mb-1">Usuario</label>
              <input class="form-control" type="email" name="usuario" id="usuario" value="{{ default_user }}" required autocomplete="username" placeholder="tu@correo.cl">
            </div>
            <div class="mb-2">
              <label class="form-label fw-bold mb-1">Clave</label>
              <input class="form-control" type="password" name="clave" placeholder="••••" required autocomplete="current-password">
            </div>
            <div class="form-check mb-3">
              <input class="form-check-input" type="checkbox" name="recordar" value="1" id="recordar">
              <label class="form-check-label" for="recordar">Recordar usuario</label>
            </div>
            <button class="btn login-submit w-100" type="submit">Ingresar</button>
          </form>
        </div>
      </div>
    </header>

    <footer class="login-foot">
      <p class="mb-2"><a class="btn btn-sm btn-outline-light" href="{{ url_for('probar') }}">Probar gratis 30 días</a></p>
      <img class="login-erpmaster" src="{{ url_for('static', filename='logo_erpmaster.png') }}" alt="ERP Master">
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
  (function () {
    const sel = document.getElementById('usuario');
    const remember = document.getElementById('recordar');
    const form = document.getElementById('loginForm');
    const savedRemember = localStorage.getItem('rm_remember') === '1';
    const savedUser = localStorage.getItem('rm_acceso') || '';
    if (savedRemember && savedUser && sel && !sel.value) {
      sel.value = savedUser;
      if (remember) remember.checked = true;
    }
    {% if error or default_user %}
    const btn = document.querySelector('.login-access-btn');
    if (btn) new bootstrap.Dropdown(btn).show();
    {% endif %}
    if (form) {
      form.addEventListener('submit', function () {
        if (remember && remember.checked) {
          localStorage.setItem('rm_remember', '1');
          localStorage.setItem('rm_acceso', sel.value);
          localStorage.removeItem('rm_clave');
        } else {
          localStorage.removeItem('rm_remember');
          localStorage.removeItem('rm_acceso');
          localStorage.removeItem('rm_clave');
        }
      });
    }
  })();
  </script>
</body>
</html>
