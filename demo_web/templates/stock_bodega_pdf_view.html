<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a5f2a">
  <title>{{ filename }} — {{ erp_title|default('Stock bodega') }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { margin: 0; background: #1a1a1a; height: 100dvh; display: flex; flex-direction: column; }
    .pdf-bar {
      flex: 0 0 auto;
      background: #1a5f2a;
      color: #fff;
      padding: 0.65rem 0.75rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0,0,0,.25);
    }
    .pdf-bar .title { flex: 1 1 8rem; font-size: 0.85rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pdf-frame-wrap { flex: 1 1 auto; min-height: 0; background: #525659; }
    .pdf-frame { width: 100%; height: 100%; border: 0; display: block; }
    .hint { font-size: 0.75rem; opacity: 0.85; padding: 0.35rem 0.75rem; background: #143d20; color: #fff; }
  </style>
</head>
<body>
  <div class="pdf-bar">
    <a class="btn btn-sm btn-outline-light" href="{{ back_url }}">← Volver</a>
    <span class="title" title="{{ filename }}">{{ filename }}</span>
    <button type="button" class="btn btn-sm btn-light" id="btnPrintPdf">Imprimir</button>
    <a class="btn btn-sm btn-outline-light" href="{{ pdf_download_url }}" download="{{ filename }}">Descargar</a>
  </div>
  <p class="hint mb-0 d-md-none">Use <strong>Volver</strong> para regresar al listado o al kardex del producto. Si Imprimir no responde en iPhone, use <strong>Descargar</strong> y comparta desde Archivos.</p>
  <div class="pdf-frame-wrap">
    <iframe class="pdf-frame" id="pdfFrame" src="{{ pdf_embed_url }}" title="{{ filename }}"></iframe>
  </div>
  <script>
  (function () {
    var btn = document.getElementById('btnPrintPdf');
    var frame = document.getElementById('pdfFrame');
    if (!btn || !frame) return;
    btn.addEventListener('click', function () {
      try {
        if (frame.contentWindow) {
          frame.contentWindow.focus();
          frame.contentWindow.print();
          return;
        }
      } catch (e) { /* cross-origin */ }
      window.open('{{ pdf_embed_url }}', '_blank');
    });
  })();
  </script>
</body>
</html>
