<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a5f2a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>{{ filename }} — {{ erp_title|default('Stock bodega') }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      flex-direction: column;
      background: #525659;
      padding-bottom: env(safe-area-inset-bottom, 0);
    }
    .pdf-bar {
      flex: 0 0 auto;
      background: #1a5f2a;
      color: #fff;
      padding: 0.55rem 0.65rem;
      padding-top: max(0.55rem, env(safe-area-inset-top));
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,.3);
    }
    .pdf-bar .title {
      flex: 1 1 6rem;
      font-size: 0.8rem;
      font-weight: 600;
      line-height: 1.2;
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }
    .pdf-scroll {
      flex: 1 1 auto;
      min-height: 0;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      background: #525659;
    }
    .pdf-scroll embed,
    .pdf-scroll object {
      display: block;
      width: 100%;
      min-height: calc(100dvh - 3.5rem);
      border: 0;
    }
    .pdf-status {
      color: #fff;
      text-align: center;
      padding: 2rem 1rem;
      font-size: 0.95rem;
    }
    .pdf-status.error { color: #ffc9c9; }
  </style>
</head>
<body>
  <div class="pdf-bar">
    <a class="btn btn-sm btn-outline-light" href="{{ back_url }}">← Volver</a>
    <span class="title" title="{{ filename }}">{{ pdf_title|default(filename) }}</span>
    <button type="button" class="btn btn-sm btn-light fw-semibold" id="btnPrintShare" disabled>
      Imprimir / compartir
    </button>
  </div>
  <div class="pdf-scroll" id="pdfScroll">
    <p class="pdf-status mb-0" id="pdfLoading">Cargando PDF…</p>
    <embed id="pdfEmbed" type="application/pdf" title="{{ filename }}" hidden />
  </div>
  <script>
  (function () {
    var srcUrl = {{ pdf_blob_url|tojson }};
    var fname = {{ filename|tojson }};
    var embed = document.getElementById('pdfEmbed');
    var loading = document.getElementById('pdfLoading');
    var btn = document.getElementById('btnPrintShare');
    var blobRef = null;

    function esIos() {
      var ua = (navigator.userAgent || '').toLowerCase();
      return /iphone|ipad|ipod|crios|fxios|edgios/.test(ua) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    }

    fetch(srcUrl, { credentials: 'same-origin' })
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.blob();
      })
      .then(function (blob) {
        blobRef = blob;
        var objUrl = URL.createObjectURL(blob);
        embed.src = objUrl;
        embed.hidden = false;
        loading.hidden = true;
        btn.disabled = false;
      })
      .catch(function () {
        loading.textContent = 'No se pudo cargar el PDF. Use Volver e intente de nuevo.';
        loading.classList.add('error');
      });

    btn.addEventListener('click', function () {
      if (!blobRef) return;
      var file = new File([blobRef], fname, { type: 'application/pdf' });
      if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file], title: fname }).catch(function () { /* cancel */ });
        return;
      }
      if (esIos()) {
        var u = URL.createObjectURL(blobRef);
        window.location.href = u;
        return;
      }
      try {
        embed.focus();
        if (embed.contentWindow) {
          embed.contentWindow.print();
          return;
        }
      } catch (e) { /* ignore */ }
      var w = window.open(URL.createObjectURL(blobRef), '_blank');
      if (w) w.onload = function () { w.print(); };
    });
  })();
  </script>
</body>
</html>
