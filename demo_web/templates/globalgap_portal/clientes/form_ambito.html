{% extends "base.html" %}
{% block title %}{{ page_title }} — GlobalGAP{% endblock %}
{% block content %}
<div class="container-fluid py-3">
  <div class="mb-3">
    <nav aria-label="breadcrumb">
      <ol class="breadcrumb mb-1 small">
        <li class="breadcrumb-item"><a href="{{ url_for('globalgap_portal.clientes_list') }}">Clientes</a></li>
        <li class="breadcrumb-item"><a href="{{ url_for('globalgap_portal.clientes_detalle', etiqueta_id=cliente.id) }}">{{ cliente.nombre }}</a></li>
        <li class="breadcrumb-item active">Nuevo ámbito</li>
      </ol>
    </nav>
    <h1 class="h3 mb-0">{{ page_title }}</h1>
    <p class="text-muted mb-0">Huerto + especie bajo CSG {{ csg.codigo_csg }}</p>
  </div>

  <div class="panel-card col-lg-8">
    <form method="post" class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Huerto / sector</label>
        <input type="text" name="nombre_huerto" class="form-control" required maxlength="120">
      </div>
      <div class="col-md-6">
        <label class="form-label">Especie / cultivo</label>
        <input type="text" name="especie_cultivo" class="form-control" placeholder="Cerezos" required maxlength="80">
      </div>
      <div class="col-md-6">
        <label class="form-label">Plantilla documentos</label>
        <select name="plantilla_docs" class="form-select">
          {% for p in plantillas %}
          <option value="{{ p }}">{{ p|title }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-6">
        <label class="form-label">Razón social (membrete)</label>
        <input type="text" name="razon_social" class="form-control" maxlength="120"
               placeholder="{{ cliente.nombre }}">
      </div>
      <div class="col-12">
        <label class="form-label">Dirección membrete (opcional)</label>
        <input type="text" name="direccion" class="form-control" maxlength="200"
               placeholder="{{ csg.direccion or 'Usa dirección del CSG si se deja vacío' }}">
      </div>
      <div class="col-12">
        <button type="submit" class="btn btn-primary">Crear ámbito y clonar documentos</button>
        <a href="{{ url_for('globalgap_portal.clientes_detalle', etiqueta_id=cliente.id) }}" class="btn btn-outline-secondary">Cancelar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
