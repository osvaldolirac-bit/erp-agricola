{% extends "base.html" %}
{% block title %}{{ page_title }} — GlobalGAP{% endblock %}
{% block content %}
<div class="container-fluid py-3">
  <div class="mb-3">
    <nav aria-label="breadcrumb">
      <ol class="breadcrumb mb-1 small">
        <li class="breadcrumb-item"><a href="{{ url_for('globalgap_portal.clientes_list') }}">Clientes</a></li>
        <li class="breadcrumb-item"><a href="{{ url_for('globalgap_portal.clientes_detalle', etiqueta_id=cliente.id) }}">{{ cliente.nombre }}</a></li>
        <li class="breadcrumb-item active">CSG</li>
      </ol>
    </nav>
    <h1 class="h3 mb-0">{{ page_title }}</h1>
    <p class="text-muted mb-0">Código y ubicación del predio/campo ante el SAG</p>
  </div>

  <div class="panel-card col-lg-7">
    <form method="post" class="row g-3">
      <div class="col-md-4">
        <label class="form-label">Código CSG</label>
        <input type="text" name="codigo_csg" class="form-control" required maxlength="40"
               value="{{ csg.codigo_csg if csg else '' }}" placeholder="Ej. 12345678">
      </div>
      <div class="col-md-8">
        <label class="form-label">Nombre predio</label>
        <input type="text" name="nombre_predio" class="form-control" required maxlength="120"
               value="{{ csg.nombre_predio if csg else '' }}">
      </div>
      <div class="col-12">
        <label class="form-label">Dirección</label>
        <input type="text" name="direccion" class="form-control" maxlength="200"
               value="{{ csg.direccion if csg else '' }}">
      </div>
      <div class="col-md-6">
        <label class="form-label">Comuna</label>
        <input type="text" name="comuna" class="form-control" maxlength="80"
               value="{{ csg.comuna if csg else '' }}">
      </div>
      <div class="col-md-6">
        <label class="form-label">Región</label>
        <input type="text" name="region" class="form-control" maxlength="80"
               value="{{ csg.region if csg else '' }}">
      </div>
      <div class="col-12">
        <label class="form-label">Notas</label>
        <input type="text" name="notas" class="form-control" maxlength="200"
               value="{{ csg.notas if csg else '' }}">
      </div>
      {% if csg %}
      <div class="col-12">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" name="activo" id="activo" {% if csg.activo %}checked{% endif %}>
          <label class="form-check-label" for="activo">CSG activo</label>
        </div>
      </div>
      {% endif %}
      <div class="col-12 d-flex gap-2">
        <button type="submit" class="btn btn-success">Guardar</button>
        <a href="{{ url_for('globalgap_portal.clientes_detalle', etiqueta_id=cliente.id) }}" class="btn btn-outline-secondary">Cancelar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
