<div class="hydra-fert-en-linea mt-2">
  <label class="hydra-fert-toggle hydra-fert-check mb-2">
    <input type="checkbox" class="form-check-input hydra-con-fert" value="1">
    <span class="hydra-fert-toggle-body">
      <span class="hydra-fert-toggle-title">Fertirriego en este sector</span>
      <span class="hydra-fert-toggle-hint">Toque para aplicar fertilizantes de bodega</span>
    </span>
  </label>
  <div class="hydra-fert-block">
    <p class="small text-muted mb-1">Lista y stock desde <strong>bodega actual</strong> (id producto). Prellenado HYDRA solo si el id sigue en bodega. Desmarque para regar sin fert.</p>
    <div class="hydra-fert-rows"></div>
    <button type="button" class="btn btn-sm hydra-btn-add-fert hydra-add-fert-row">+ Fertilizante</button>
  </div>
</div>
