{# Requiere: tab, token; opcional operador (link regador) #}
<nav class="hydra-link-tabs" aria-label="Secciones HYDRA">
  {% set op_qs = ('&op=' ~ operador.id) if operador else '' %}
  <a class="hydra-link-tab{% if tab == 'control' %} is-active{% endif %}"
     href="?t={{ token }}&tenant=concepcion&tab=control{{ op_qs }}">Control</a>
  <a class="hydra-link-tab{% if tab == 'bitacora' %} is-active{% endif %}"
     href="?t={{ token }}&tenant=concepcion&tab=bitacora{{ op_qs }}">Bitácora</a>
</nav>
