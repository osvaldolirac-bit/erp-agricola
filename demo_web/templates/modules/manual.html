{% extends "base.html" %}
{% block title %}Manual — {{ erp_title|default('ERP') }}{% endblock %}
{% block content %}
<div class="container-fluid py-3">
  <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3">
    <div>
      <h1 class="h3 mb-0">Manual de usuario</h1>
      <p class="text-muted mb-0">{{ aviso }}</p>
    </div>
    <div class="btn-group">
      <a href="{{ url_for('modules.manual', doc='guia') }}" class="btn btn-sm {% if doc != 'completo' %}btn-primary{% else %}btn-outline-primary{% endif %}">Guía rápida</a>
      <a href="{{ url_for('modules.manual', doc='completo') }}" class="btn btn-sm {% if doc == 'completo' %}btn-primary{% else %}btn-outline-primary{% endif %}">Manual completo</a>
    </div>
  </div>
  <div class="panel-card manual-viewer">
    {{ html|safe }}
  </div>
</div>
{% endblock %}
