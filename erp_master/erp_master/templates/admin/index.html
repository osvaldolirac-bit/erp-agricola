<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ brand }} — ERP clientes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Sora:wght@400;550;650&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='master.css') }}">
</head>
<body>
  <div class="shell">
    <main class="console">
      {% include "_topbar.html" %}

      <div class="section-head">
        <p class="crumb"><a href="{{ url_for('home') }}">Inicio</a> / ERP clientes</p>
        <h2>Administración de ERP</h2>
        <p>Paneles dentro de la consola. No te lleva al ERP; el acceso web queda aparte.</p>
      </div>

      <ul class="tenant-list">
        {% for t in admin_tenants %}
        <li>
          <div class="tenant-row">
            <a class="tenant-main" href="{{ url_for('admin_tenant', slug=t.slug) }}">
              <div>
                <div class="name">{{ t.nombre }}</div>
                <div class="desc">Usuarios · módulos · respaldos</div>
              </div>
              <div class="meta">
                <span class="status">consola</span>
                <span class="go">Abrir panel →</span>
              </div>
            </a>
            <a class="tenant-admin is-secondary" href="{{ t.url }}" target="_blank" rel="noopener">ERP web</a>
          </div>
        </li>
        {% endfor %}
      </ul>
    </main>
  </div>
</body>
</html>
