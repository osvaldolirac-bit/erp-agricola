<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ brand }} — Acceso</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Sora:wght@400;550;650&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='master.css') }}">
</head>
<body>
  <div class="shell">
    <section class="login" aria-label="Acceso consola">
      <header class="brand-mark">
        <div class="eyebrow">Consola</div>
        <h1>{{ brand }}</h1>
        <p>{{ tagline }}. No es el ERP: es la consola de plataforma.</p>
      </header>

      <form class="panel" method="post" autocomplete="off">
        {% if info %}
        <p class="banner banner-ok" role="status">{{ info }}</p>
        {% endif %}
        {% if error %}
        <p class="error" role="alert">{{ error }}</p>
        {% endif %}
        <label for="email">Correo</label>
        <input id="email" name="email" type="email" autocomplete="username" required autofocus>

        <label for="password">Clave</label>
        <input id="password" name="password" type="password"
               autocomplete="current-password" required>

        <label class="remember-row" for="remember">
          <input id="remember" name="remember" type="checkbox" value="1">
          Recordar usuario
        </label>

        <button class="btn btn-primary" type="submit">Entrar a la consola</button>
      </form>
    </section>
  </div>
  <script>
  (function () {
    const storageKey = 'erp_master_remember_user';
    const form = document.querySelector('.panel');
    const emailInput = document.getElementById('email');
    const rememberInput = document.getElementById('remember');
    if (!form || !emailInput || !rememberInput) return;

    try {
      const raw = localStorage.getItem(storageKey);
      const data = raw ? JSON.parse(raw) : null;
      if (data && data.remember && data.email) {
        emailInput.value = String(data.email).trim();
        rememberInput.checked = true;
      }
    } catch (err) {}

    form.addEventListener('submit', function () {
      try {
        const email = (emailInput.value || '').trim();
        if (rememberInput.checked && email) {
          localStorage.setItem(storageKey, JSON.stringify({ remember: true, email: email }));
        } else {
          localStorage.removeItem(storageKey);
        }
      } catch (err) {}
    });
  })();
  </script>
</body>
</html>
