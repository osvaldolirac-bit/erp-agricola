<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ brand }} — Acceso</title>
  <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='master.css') }}">
</head>
<body class="login-page">
  <section class="login-card" aria-label="Acceso consola">
    <img class="logo" src="{{ url_for('static', filename='logo_erpmaster.png') }}" alt="ERP Master">
    <div class="kicker">Consola de plataforma</div>
    <h1>{{ brand }}</h1>
    <p class="tagline">{{ tagline }}. No es el ERP del cliente: es la Super Consola.</p>

    <form method="post" autocomplete="off" id="loginForm">
      {% if error %}
      <p class="error" role="alert">{{ error }}</p>
      {% endif %}
      <label for="email">Correo</label>
      <input id="email" name="email" type="email" autocomplete="username" required autofocus>

      <label for="password">Clave</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>

      <label class="remember-row" for="remember">
        <input id="remember" name="remember" type="checkbox" value="1">
        Recordar usuario
      </label>

      <button class="btn btn-primary" type="submit" style="width:100%;margin-top:1.1rem">Entrar a la consola</button>
    </form>
  </section>
  <script>
  (function () {
    const storageKey = 'erp_master_remember_user';
    const form = document.getElementById('loginForm');
    const emailInput = document.getElementById('email');
    const rememberInput = document.getElementById('remember');
    if (!form || !emailInput || !rememberInput) return;
    try {
      const raw = localStorage.getItem(storageKey);
      const data = raw ? JSON.parse(raw) : null;
      if (data && data.remember && data.email) {
        emailInput.value = String(data.email).trim();
        rememberInput.checked = true;
      }
    } catch (err) {}
    form.addEventListener('submit', function () {
      try {
        const email = (emailInput.value || '').trim();
        if (rememberInput.checked && email) {
          localStorage.setItem(storageKey, JSON.stringify({ remember: true, email: email }));
        } else {
          localStorage.removeItem(storageKey);
        }
      } catch (err) {}
    });
  })();
  </script>
</body>
</html>
