<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ brand }} — Acceso</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon-32x32.png') }}?v=1785543581" sizes="32x32">
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}?v=1785543581">
  <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}?v=1785543581" sizes="any">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Sora:wght@400;550;650&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='master.css') }}">
</head>
<body>
  <div class="shell">
    <section class="login" aria-label="Acceso Super Consola">
      <div class="brand-mark">
        <img src="{{ url_for('static', filename='logo_erpmaster.png') }}" alt="{{ brand }}" style="max-width:200px;height:auto;margin-bottom:1rem;">
        <div class="eyebrow">Super Consola</div>
        <h1>{{ brand }}</h1>
        <p>{{ tagline or 'Administración de tenants ERP Master' }}</p>
      </div>

      <div class="panel">
        {% if info %}<p class="error" style="background:#e8f5ee;color:#1f4d3a;border:1px solid rgba(31,77,58,.2)">{{ info }}</p>{% endif %}
        {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}

        <form method="post" action="{{ url_for('login') }}" autocomplete="off" id="loginForm">
          <label for="email">Correo</label>
          <input id="email" name="email" type="email" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>

          <label for="password">Clave</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>

          <label class="remember-row" for="remember">
            <input id="remember" name="remember" type="checkbox" value="1">
            Recordar usuario
          </label>

          <button class="btn btn-primary" type="submit">Ingresar a la consola</button>
        </form>
      </div>
    </section>
  </div>

  <script>
  (function () {
    const storageKey = 'erp_master_remember_user';
    const form = document.getElementById('loginForm');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const rememberInput = document.getElementById('remember');
    if (!form || !emailInput || !rememberInput) return;

    const loggedOut = window.location.search.indexOf('out=1') >= 0;
    if (loggedOut) {
      try { localStorage.removeItem(storageKey); } catch (e) {}
      emailInput.value = '';
      if (passwordInput) passwordInput.value = '';
      rememberInput.checked = false;
    } else {
      try {
        const raw = localStorage.getItem(storageKey);
        const data = raw ? JSON.parse(raw) : null;
        if (data && data.remember && data.email) {
          emailInput.value = String(data.email).trim();
          rememberInput.checked = true;
        }
      } catch (err) {}
    }

    form.addEventListener('submit', function () {
      try {
        const email = (emailInput.value || '').trim();
        if (rememberInput.checked && email) {
          localStorage.setItem(storageKey, JSON.stringify({ remember: true, email: email }));
        } else {
          localStorage.removeItem(storageKey);
        }
      } catch (err) {}
    });
  })();
  </script>
</body>
</html>
